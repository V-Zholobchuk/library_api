version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lib_user
      POSTGRES_PASSWORD: lib_pass
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lib_user -d library_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lib_user:lib_pass@db:5432/library_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
